name: Site smoke test
on:
  push:
    branches: ["claude/wampo-401k-live-nx1t4o"]
    # DATA paths are here deliberately. The smoke test used to run only when
    # frontend code changed, so the pipeline could rewrite every data file and
    # nothing checked that the site still booted against it — which is exactly
    # how a broken map reached the live site unnoticed.
    paths: ["app.js", "index.html", "styles.css", "data.js", "fund-er.js",
            "scripts/smoke-test.mjs", "scripts/map-test.mjs",
            "scripts/fund-er-test.mjs", "scripts/no-identity-test.mjs",
            "scripts/vesting-quote-test.mjs", "scripts/lib-quote.mjs",
            # v201 put `vestingQuoteUpgrade` in the PARSER, so a lib-4i change
            # can now break the vesting-quote gate's sliced controls. It belongs
            # here and NOT in build-data's prep gate: that test holds the
            # withheld population to a ceiling, which is a DATA condition, and a
            # data condition must never be able to stop the pipeline ingesting
            # new filings. A red site-test blocks nothing but the verdict.
            "scripts/lib-4i.mjs", "scripts/slice-vq.mjs",
            "scripts/lib-disclose.mjs", "scripts/build-seo-pages.mjs",
            # the SEC ticker table, its consumer's harness, and the matcher
            # whose answers it carries
            "sec-tickers.js", "scripts/sec-tickers-test.mjs",
            "scripts/gen-sec-tickers.mjs", "scripts/house-core-test.mjs",
            "scripts/apppath.mjs", "scripts/match-sec-tickers.mjs",
            "scripts/fund-note-test.mjs",
            # merge-4i carries SEVEN name repairs that rewrite the store, and
            # until 2026-10-11 none of them was tethered here -- so a change to
            # one ran no test of its own. `noun-repair-test` slices the leading-
            # unit-noun arm out of this file, so the file it reads must trigger
            # it: every other tethered source (lib-disclose, lib-4i, lib-quote,
            # match-sec-tickers) is already in this list and merge-4i was absent
            # only because nothing covered it. Without the entry the gate is the
            # shape this record names for `gen-sec-tickers.mjs` -- a check that
            # exists and is wired into no workflow.
            "scripts/merge-4i.mjs", "scripts/noun-repair-test.mjs",
            "plans-list.json", "plans-index.json", "map-points.json"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Runs BEFORE Playwright is installed: it needs no browser, and a name
      # that resolves to the wrong fund should fail the run in ten seconds
      # rather than after a five-minute install. A wrong ticker is a wrong
      # expense ratio on a live page, so this gate is about accuracy, not
      # coverage — half its fixtures are names that must stay blank.
      - name: Fund-name matcher — resolves what it should, blanks what it must
        run: node scripts/fund-er-test.mjs
      # The no-identity predicate qualifies a row whose name carries no fund in
      # it at all (`shares`, `Fund`, `UNIT`, `E.I.N. 23-`) — 486 rows / 325
      # plans / 1,131,917 participants. Its whole risk is the other direction,
      # so half the fixtures are REAL names that must never be qualified,
      # including the largest holdings of Amazon, Cigna and Mayo Clinic. It also
      # asserts that the two display surfaces agree, because app.js passes the
      # RAW name where build-seo-pages passes the CLEANED one. Cheap, no
      # network, runs before the Playwright install like its neighbours.
      - name: No-identity names — qualifies fragments, never a real fund
        run: node scripts/no-identity-test.mjs
      # The vesting-quote guard withholds a sentence published under
      # "Employer-money vesting" that states a DIFFERENT plan rule — Charter
      # Communications a loan limit (120,688 ppl), PSEG a withdrawal-suspension
      # rule, Vensure raw Form 5500 table text whose only vest-word sits inside
      # VESTED METALS INTERNATIONAL LLC. 41 entries / 226,729 participants, all
      # of which publish the quote as their WHOLE answer. Five screens for this
      # class were refuted by reading their own members before the shipped
      # conjunction was written, so 14 of the 22 fixtures are REAL vesting
      # quotes those screens wrongly caught, and the gate holds the withheld
      # population to a ceiling: a predicate that grows to 4,100 entries is a
      # different predicate.
      - name: Vesting quote — withholds another rule, never a real schedule
        run: node scripts/vesting-quote-test.mjs
      # app.js's copy of the two quote guards is SLICED from lib-quote.mjs, and
      # the slicer that built it lived in gitignored scratchpad/ and could only
      # INSERT -- so the only way to change the twin was to hand-edit app.js,
      # which is how this project has lost four browser twins. The slicer is
      # tracked and replaces in place now, and this is what makes that worth
      # anything: a hand-edited or drifted twin fails here. Promoting it caught
      # a real near-miss on its first run -- the slice reaches `quoteTrim`, so a
      # by-name export rewrite left `export function quoteTrim` inside app.js's
      # IIFE, which `node --check` PASSES (it parses as a module) and every
      # browser rejects as a SyntaxError, loading no app.js at all.
      - name: Quote-guard twin — app.js must be a verbatim slice of lib-quote
        run: node scripts/slice-vq.mjs --check
      # `sec-tickers.js` is GENERATED and its consumer in app.js is
      # hand-written, which is the exact shape of every twin this project has
      # lost. The failure mode is SILENT: if the table's keys stop matching the
      # arm's key expression, every row it would answer simply stays blank —
      # which is what the page shows today, so no reader and no count can tell.
      # This asks the real `lookupTicker` for the pin, asserts the answer is
      # ASSERTED and never a comparable, asserts the arm stands down where the
      # page's own chain answers and where the filing's own `f.tk` is present,
      # and asserts that `secTickers:false` disables it — which is the
      # generator's own premise and, loaded, would make it write an empty table.
      - name: SEC ticker table — the generated answers still reach the page
        run: node scripts/sec-tickers-test.mjs
      # The issuer-cell reduction that produces 2,983 of those keys. Its hazard
      # is that the issuer cell routinely holds the CUSTODIAN or PLATFORM, so
      # reducing a platform's cell to its house core asserts a registered fund
      # on a row the filer says is a sub-account -- which it did, on 30 keys,
      # before the refusals. The test slices the arm and supplies its own FROZEN
      # platform set, so its verdicts are a property of the code and a DOL
      # refresh cannot redden it with nothing wrong.
      - name: Issuer-cell reduction — the platform refusals still hold
        run: node scripts/house-core-test.mjs
      # The comparable-fee footnote is the largest disclosure dependency on the
      # record: 45,067 published rows / 34,282,495 participants /
      # $1,455,409,472,270 publish a comparable's expense ratio, and what makes
      # that honest rather than wrong is ONE paragraph naming the fee's
      # provenance, its DIRECTION and its status as a ceiling. Microsoft's
      # `Fidelity Growth Company Pool Class S` publishes FDGRX's 0.61 on $8.2B;
      # read as a ceiling that is true, and with the paragraph reworded it is a
      # retail fee presented as the plan's price. A reword drops no count and no
      # diff would say a word, so this asserts each clause separately AND the
      # three-link `starred` chain -- break a link and the asterisks still print
      # with the footnote gone, which is worse than either state.
      - name: Comparable-fee disclosure — the footnote and its chain are intact
        run: node scripts/fund-note-test.mjs
      # merge-4i strips a leading unit noun ("shares Fidelity Blue Chip Growth",
      # "sh. Mutual fund") when the REMAINDER is attested as another filing's
      # whole name. 274 rows / 78,586 participants / $2,483,915,336, and the
      # witness is the only thing that can tell `sh Stock Fund` from
      # `SH Term Corp Bond IDX ADM`, where SH abbreviates SHORT -- no pattern
      # separates those. The queue's own named hazard is the class's largest
      # row: unguarded, Estee Lauder's $553,288,718 holding becomes "of
      # Registered Investment Company" and Central City Concern's 91.61% row
      # becomes "of". The test SLICES the arm and supplies its own FROZEN
      # attestation map, so its verdicts are a property of the code and a DOL
      # refresh cannot redden it -- the property merge-name-test lacks, whose
      # status has flipped three times on drift alone.
      - name: Leading-unit-noun repair — the witness and the floors still hold
        run: node scripts/noun-repair-test.mjs
      # index.html cache-busts its assets with a query string, and that string
      # was typed by hand until 2026-10-02 -- when it was found SEVENTEEN DAYS
      # stale, with app.js and fund-er.js both changed that same day. A
      # returning browser asks for the URL it already has, so every display-side
      # fix in that window could be invisible to the people it shipped for while
      # pages-build-deployment reported success on every mirror. The owner
      # reported it as "nothing is updated in wampo". The stamp is derived from
      # each asset's own content hash now, and this gate is what makes deriving
      # it worth anything: a frontend push with a stale stamp fails here instead
      # of shipping invisibly. Runs before the five-minute Playwright install,
      # for the same reason the matcher gate does.
      - name: Asset stamps match their content — a stale one ships nothing
        run: node scripts/stamp-assets.mjs --check
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Smoke test the site as a visitor
        run: node scripts/smoke-test.mjs
      - name: Map view — draws, filters, and never misplaces a plan
        run: node scripts/map-test.mjs
