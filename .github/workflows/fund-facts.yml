name: Fetch fund facts (ticker, expense ratio, YTD return)

# The CCR sandbox cannot reach any fund-data host (egress policy, measured
# 2026-09-17), so the retrieval runs here, where egress is open — the same
# route the EDGAR 11-K fetch uses. The fund-facts agent's rules and the
# checker still govern what gets written: nothing undated, nothing unsourced.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "space-separated tickers (blank = refresh the file + seed list)"
        required: false
        default: ""
      mode:
        description: "probe = only ask which sources answer a runner, and write nothing; fetch = the Yahoo path (known to 429 here)"
        required: false
        default: "probe"
        type: choice
        options: ["probe", "fetch"]
  # SCHEDULE DISABLED 2026-09-18: runs #1 and #2 both got HTTP 429 from
  # Yahoo on every call (quoteSummary AND the crumb-free chart endpoint) —
  # Yahoo rate-limits GitHub's runner IP range outright. A daily red run is
  # noise, not coverage. Re-enable when a source answers from here: an API
  # key (Alpha Vantage / FMP / Polygon) as a repo secret, or the sandbox
  # network allowlist for the fund company pages.
  # schedule:
  #   - cron: "41 22 * * 1-5"   # weekdays 22:41Z, after the US close

permissions:
  contents: write

concurrency:
  group: fund-facts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wampo-401k-live-nx1t4o
          # DEPTH 1, AND THE TWO EARLIER GUESSES WERE BOTH WRONG. `fetch-depth:
          # 0` was inherited from `mirror-gate-test`, which does not run here;
          # cutting it to 50 did NOT help, because fifty revisions of this
          # repo's hourly multi-megabyte single-line JSON stores is still an
          # enormous fetch. (And my own note on that commit was wrong: run #5's
          # checkout did not take seven seconds, its LOG merely began after
          # checkout finished -- so checkout was always minutes, and run #6 was
          # the same cost rather than an anomaly. A step whose duration is only
          # visible as the gap before the first log line is easy to read as
          # free.) Nothing in this job reads history: both probes are stateless,
          # and the commit step deepens on demand below.
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # WHICH SOURCE WILL TALK TO A RUNNER? Yahoo 429'd runs #1 and #2 on every
      # call, which is why the schedule above is disabled. Building a second
      # fetcher before answering that question would repeat the mistake, so the
      # probe runs first, writes NOTHING, and its log is the evidence.
      - name: Probe the candidate sources (writes nothing)
        run: node scripts/fund-source-probe.mjs
      # ONE KNOWN URL AS THE KEY TO A WHOLE LADDER. The owner supplied a real
      # J.P. Morgan product URL on 2026-11-04 and asked whether the other
      # target-date vintages can be found from it. Each vintage and share class
      # has its own CUSIP, so they cannot be guessed -- but a target-date page
      # normally carries a vintage selector. This harvests the sibling links out
      # of the page rather than assuming either way. Writes nothing.
      - name: Harvest sibling product links from one known page (writes nothing)
        run: node scripts/issuer-page-probe.mjs
      # The worklist is regenerated here because it is derived from the store,
      # and the store moves hourly. It sources nothing either.
      - name: Rebuild the worklist (top 1,000 names = 91.2% of readers)
        run: node scripts/fund-worklist.mjs --top 1000
      - name: Fetch
        if: inputs.mode == 'fetch'
        run: node scripts/fetch-fund-facts.mjs ${{ github.event.inputs.tickers }}
      - name: Validate
        run: node scripts/fund-facts-check.mjs
      - name: Commit to the dev branch
        run: |
          git config user.name "wampo-data-bot"
          git config user.email "noreply@anthropic.com"
          git add data/fund-facts.json data/fund-worklist.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "Update fund facts and the sourcing worklist [skip ci]"
          # The checkout is depth 1, so a rebase has no common ancestor to work
          # from. Deepen only HERE, on the one path that needs history, rather
          # than paying for it on every probe-only run -- which is most of them,
          # since `mode: probe` writes nothing and never reaches this step.
          git fetch -q --deepen=50 origin claude/wampo-401k-live-nx1t4o || true
          for i in 1 2 3 4; do
            git pull -q --rebase origin claude/wampo-401k-live-nx1t4o && git push -q origin HEAD:claude/wampo-401k-live-nx1t4o && exit 0
            sleep $((i * 5))
          done
          exit 1
