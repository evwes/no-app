name: Fetch fund facts (ticker, expense ratio, YTD return)

# The CCR sandbox cannot reach any fund-data host (egress policy, measured
# 2026-09-17), so the retrieval runs here, where egress is open — the same
# route the EDGAR 11-K fetch uses. The fund-facts agent's rules and the
# checker still govern what gets written: nothing undated, nothing unsourced.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "space-separated tickers (blank = refresh the file + seed list)"
        required: false
        default: ""
      mode:
        description: "probe = only ask which sources answer a runner, and write nothing; fetch = the Yahoo path (known to 429 here)"
        required: false
        default: "probe"
        type: choice
        options: ["probe", "fetch"]
  # SCHEDULE RE-ENABLED 2026-11-14, on the owner's requirement that the YTD
  # figure be updated DAILY AT 3 AM EASTERN for the previous day.
  #
  # It was disabled 2026-09-18 because Yahoo 429'd runs #1 and #2 on every
  # call and a daily red run is noise, not coverage. The condition written
  # down for re-enabling it was "when a source answers from here", and that
  # has now happened twice over: the ticker path moved to schwab.wallst.com
  # (measured answering a runner on run #8, with er AND ytd), and the vehicle
  # path reads each entry's OWN recorded issuer URL. Neither touches Yahoo,
  # and `scripts/fetch-fund-facts.mjs` — the Yahoo path — stays unused.
  #
  # 0 8 UTC is 03:00 Eastern under EST, checked through the one place that
  # conversion lives: `node scripts/et-schedule.mjs --check 8 0 3 0`. It will
  # read 04:00 Eastern after the 2026-03-08 transition and must be re-checked
  # then — a fixed UTC cron is right for eight months and silently an hour
  # wrong for the rest.
  schedule:
    - cron: "0 8 * * *"   # 03:00 Eastern (EST) — the previous day's figures

permissions:
  contents: write

concurrency:
  group: fund-facts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 35, up from 20: a 1,000-name fetch is about a second per name (a ~400ms
    # request plus 600ms of politeness), so roughly 17 minutes of fetching plus
    # checkout and the probes. The politeness delay is NOT what to cut if this
    # ever runs long -- the limit is.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wampo-401k-live-nx1t4o
          # DEPTH 50, AND THIS IS THE MEASURED VALUE RATHER THAN THE THIRD
          # GUESS. `fetch-depth: 0` was inherited from `mirror-gate-test`,
          # which does not run here, and it cost run #6 thirteen minutes in
          # checkout against a repo that commits multi-megabyte single-line
          # JSON stores hourly. Depth 50 was then measured on run #7 from its
          # own step timings: checkout 23:05:02 -> 23:05:47, FORTY-FIVE SECONDS,
          # and the whole job 2 minutes.
          #
          # I claimed twice in commit messages that depth 50 "did not help" and
          # both claims were read off a run that had not started its checkout at
          # all -- the run list said `in_progress` while the job was still
          # QUEUED. A queued job and a slow step are indistinguishable in that
          # view; only the per-step timestamps separate them, and they are one
          # API call away. Nothing here reads history, so depth could go lower,
          # but 50 is what has been measured and it keeps the commit step's
          # rebase working without a deepen-on-demand path that no run has yet
          # exercised.
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # WHICH SOURCE WILL TALK TO A RUNNER? Yahoo 429'd runs #1 and #2 on every
      # call, which is why the schedule above is disabled. Building a second
      # fetcher before answering that question would repeat the mistake, so the
      # probe runs first, writes NOTHING, and its log is the evidence.
      - name: Probe the candidate sources (writes nothing)
        run: node scripts/fund-source-probe.mjs
      # ONE KNOWN URL AS THE KEY TO A WHOLE LADDER. The owner supplied a real
      # J.P. Morgan product URL on 2026-11-04 and asked whether the other
      # target-date vintages can be found from it. Each vintage and share class
      # has its own CUSIP, so they cannot be guessed -- but a target-date page
      # normally carries a vintage selector. This harvests the sibling links out
      # of the page rather than assuming either way. Writes nothing.
      - name: Harvest sibling product links from one known page (writes nothing)
        run: node scripts/issuer-page-probe.mjs
      # The worklist is regenerated here because it is derived from the store,
      # and the store moves hourly. It sources nothing either.
      - name: Rebuild the worklist (top 1,000 names = 91.2% of readers)
        run: node scripts/fund-worklist.mjs --top 1000
      # CALIBRATION, NOT DEBUGGING. The extractor's patterns are written against
      # a page shape that cannot be fetched from the CCR sandbox, so --explain
      # prints the bytes around each figure it looks for and writes NOTHING.
      # One runner pass is then the evidence for the real patterns, instead of a
      # guessed pattern whose silent zero would be indistinguishable from "the
      # source does not carry it".
      # THE TETHER BEFORE THE FETCH, ALWAYS. Its fixtures are REAL page text
      # from run #9, where a label-proximity read took the day's price change
      # for the expense ratio and gave FXAIX 0.37% instead of 0.015% -- four
      # plausible, dated, sourced and WRONG figures that only --explain caught.
      # If this suite reddens, nothing below it may write a fee.
      - name: Tether — the fee must come from its own column, not the quote
        run: node scripts/fund-facts-extract-test.mjs
      - name: Explain what the issuer page actually says (writes nothing)
        if: inputs.mode == 'probe'
        run: node scripts/fund-facts-issuer.mjs --limit 6 --explain
      # VERIFY THE COLUMN ON AN ACTIVE FUND, not just an index fund. Every
      # fixture in the tether is a Fidelity INDEX fund with the same page shape
      # and a tiny expense ratio, so the positional anchor has only ever been
      # checked against one layout. An active fund's page may carry a gross
      # ratio beside the net one, which would shift every field right and still
      # read as a plausible fee. These five are the UP-movers the impact
      # measurement flagged -- FCNTX came back 0.74 where our own pattern table
      # says 0.39 and 0.45. Writes nothing.
      - name: Explain the active funds whose sourced fee moved UP
        if: inputs.mode == 'probe'
        run: node scripts/fund-facts-issuer.mjs --explain --tickers FCNTX FDGRX SPAXX VMFXX FXAIX
      # The ticker-keyed path measured in run #8: sec-funds.json -> ticker ->
      # schwab.wallst.com, which answered 200 with er AND ytd for three foreign
      # houses. `fetch-fund-facts.mjs` is the Yahoo path and stays unused --
      # Yahoo 429'd runs #1 and #2 and has answered 401 to every probe since.
      # LIMIT 1000 -- the whole worklist, which is the 91.2%-of-readers set.
      # Run #11 did 120 names in about two minutes of the job's
      # twenty, at roughly one second each (a ~400ms fetch plus 600ms of
      # politeness), so 400 costs about seven minutes and leaves headroom. The
      # yield falls as the list goes deeper -- the top of the worklist is
      # registered funds and the tail is collective trusts with no registered
      # series at all -- so this is diminishing rather than linear, and the
      # per-name misses are printed with their reason so the falloff is
      # visible rather than assumed.
      # A SCHEDULED RUN CARRIES NO INPUTS, so `inputs.mode` is empty and a
      # condition written only as `== 'fetch'` would make every nightly run a
      # no-op that reports success -- the failure shape this record names as
      # worse than a red run. The default is therefore FETCH when nothing was
      # chosen, and a hand dispatch still defaults to probe through the input.
      - name: Fetch (tickers — the registered funds)
        if: inputs.mode == 'fetch' || github.event_name == 'schedule'
        run: node scripts/fund-facts-issuer.mjs --limit 1000 --verbose
      # THE OTHER HALF, AND IT IS A DIFFERENT JOB (owner, 2026-11-14): "CITs and
      # mutual funds will need different verification, both are needed." A
      # collective trust has no ticker, so it is never in the worklist above and
      # the step above can never refresh one. This re-reads each sourced
      # vehicle's OWN recorded issuer URL. It refreshes and never discovers: it
      # cannot add an entry, change a key or invent a source, so a cron job is
      # never deciding what a fund is.
      - name: Fetch (vehicles — the collective trusts)
        if: inputs.mode == 'fetch' || github.event_name == 'schedule'
        run: node scripts/fund-vehicles-refresh.mjs
      # AND THE BROWSER MUST ACTUALLY SEE IT. data/fund-facts.json is the source
      # of truth; fund-facts.js is what the page loads, and index.html carries a
      # content-hash cache-buster. Without the regenerate-and-restamp a refreshed
      # figure lands in git and NO READER EVER SEES IT -- which is exactly what
      # the owner once reported as "nothing is updated in wampo" after four
      # stamps went seventeen days stale.
      - name: Regenerate the browser asset and re-stamp
        if: inputs.mode == 'fetch' || github.event_name == 'schedule'
        run: |
          node scripts/gen-fund-facts-asset.mjs
          node scripts/stamp-assets.mjs
          node scripts/stamp-assets.mjs --check
      - name: Validate
        run: node scripts/fund-facts-check.mjs
      - name: Commit to the dev branch
        run: |
          git config user.name "wampo-data-bot"
          git config user.email "noreply@anthropic.com"
          git add data/fund-facts.json data/fund-worklist.json fund-facts.js index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "Update fund facts and the sourcing worklist [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase origin claude/wampo-401k-live-nx1t4o && git push -q origin HEAD:claude/wampo-401k-live-nx1t4o && exit 0
            sleep $((i * 5))
          done
          exit 1
