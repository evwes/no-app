name: Build plan data from Form 5500

on:
  workflow_dispatch:
  schedule:
    # DAILY refresh at 05:12 UTC — 1:12 AM Eastern while EDT, 12:12 AM once EST
    # returns on 2026-11-01. This is the DURABLE half of the cadence: the
    # hourly agent cycle is session-scoped and dies with its session, whereas
    # this runs whether or not any session exists, so new EFAST2 filings are
    # still ingested, the audit still runs, and HIGH findings still reach the
    # auto-managed issue during any gap.
    #
    # Off-minute on purpose: every schedule written by hand lands on :00, and
    # GitHub's own queue is worst there — a Monday 06:00 job here once fired at
    # 10:02. :12 is likelier to start near its time.
    #
    # A scheduled run executes on the DEFAULT branch and therefore commits its
    # data to main, exactly as the weekly cron below already has for months.
    # That is why the mirror protocol requires checking
    # `git log origin/main --not origin/<dev branch>` before every force-mirror
    # — a daily schedule makes that check daily rather than weekly.
    - cron: "12 5 * * *"
    # hourly incremental backstop (owner directive 2026-09-06 after two days of
    # silence): parse new filings on the hour with no session anywhere. A no-op
    # hour exits at "No data changes" without committing, so this is free and
    # quiet; GitHub delays cron on public runners (measured 4-8h on the daily),
    # so treat the stated minute as approximate.
    - cron: "23 * * * *"
    # weekly refresh: new EFAST2 filings, plan-year rollovers, new lineups
    # (scheduled runs execute on the default branch only)
    - cron: "0 6 * * 1"
  push:
    # main is a force-mirror of the dev branch, so a main push trigger would
    # run the identical parse twice — dev-branch runs are the only push runs
    branches: ["claude/wampo-401k-live-nx1t4o"]
    paths: ["scripts/build-data.mjs", "scripts/fetch-4i.mjs", "scripts/lib-4i.mjs", "scripts/merge-4i.mjs", "scripts/.kick", ".github/workflows/build-data.yml"]

# a newer push supersedes an in-flight parse of the same ref: the work list is
# recomputed from parser versions anyway, so cancel instead of double-parsing
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # issues: write powers the auto-managed "Data audit: HIGH findings" issue
  issues: write

# 2026-09-19: a SCHEDULED run is incremental by construction. Every mirror puts
# the dev branch's code on main ahead of the store it is about to produce, and
# the hourly cron answered that version gap with a full re-parse of its own on
# main — #384 held all twenty runner slots for 3.5 hours and #387 starved the
# dev branch's finished run of its merge job. fetch-4i reads this in both the
# prep sizing pass and the parse shards: on a schedule event a parser-version
# gap is not work; new filings, stale errors and OCR-version moves still are.
# workflow_dispatch and push runs are untouched — they carry the re-parses.
env:
  SCHEDULE_INCREMENTAL: ${{ github.event_name == 'schedule' && '1' || '' }}

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parser gate (ten live specimens — fails fast before the matrix)
        run: |
          # TOOLCHAIN PROBE — see the parse step below for what this cost.
          # `apt-get update` first (a stale index makes install resolve
          # nothing), output kept, and NO `|| true`: the parser cannot read a
          # filing without pdftotext, so a missing binary must fail the job in
          # four seconds rather than produce a confident-looking empty store.
          sudo apt-get update -qq
          sudo apt-get install -y -q poppler-utils
          pdftotext -v
          node scripts/parser-gate.mjs
      # The ingest scanners have crafted-fixture tests that need no network and
      # run in under a second. They were written and never wired, so a
      # regression in Schedule C or D capture could only have been found by
      # reading the data afterwards. Fails fast, before the download.
      - name: Ingest gate (Schedule C item 1, Schedule D names, match formula)
        run: |
          node scripts/schc-item1-test.mjs
          node scripts/schd-name-test.mjs
          node scripts/match-formula-test.mjs
      - name: Download and process DOL Form 5500 datasets
        run: node scripts/build-data.mjs
      - name: Plan parse shards
        id: plan
        run: |
          OUT=$(BATCH_4I=0 node scripts/fetch-4i.mjs)
          WORK=$(echo "$OUT" | grep -oP 'work list: \K\d+' || echo 0)
          OCR=$(echo "$OUT" | grep -oP 'ocr candidates: \K\d+' || echo 0)
          # OCR items cost ~20-45s vs ~0.6s for text parses — shard for both.
          # Divisor lowered 600 -> 400 on 2026-09-10. At 600 an OCR-heavy shard
          # carries 600 items; at the 45s end of that range it needs 7.5 hours
          # against a 320-minute budget, so the old figure only ever worked
          # because `ocr candidates` was under-reporting (it counted the v12
          # trigger, ~19, while the real OCR population was thousands — that is
          # what sized run #249's matrix at THREE shards for 11,435 OCR-heavy
          # filings). With the count honest, 400 keeps a shard inside budget at
          # the slow end. Actions minutes are free and wall clock is not, so
          # bias toward more shards: the cost of over-sharding is nothing, the
          # cost of under-sharding is a run that dies after three hours.
          N1=$(( (WORK + 5499) / 5500 )); N2=$(( (OCR + 399) / 400 ))
          N=$N1; [ "$N2" -gt "$N" ] && N=$N2
          [ "$N" -lt 1 ] && N=1; [ "$N" -gt 20 ] && N=20
          echo "work=$WORK ocr=$OCR shards=$N"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -e "console.log(JSON.stringify([...Array($N).keys()]))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: data-inputs
          path: |
            plans-all.json
            plans-list.json
            mtias.json
            fee-percentiles.json
            fallbacks.json
            lineups-status.json
            lineups-index.json
            data/lineups/
            data/fees/
            data/plans/
          include-hidden-files: false

  parse:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: data-inputs
      # OCR text cache: parser-version bumps re-parse everything but should
      # NOT re-rasterize ~12k scanned filings (~4h). Keyed per shard with a
      # unique suffix so every run SAVES its updated cache; restore-keys pick
      # the newest previous one. OCR_VERSION lives in the cached filenames,
      # so bumping it simply misses and repopulates.
      - uses: actions/cache@v4
        with:
          path: ocr-cache
          key: ocr-cache-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ocr-cache-shard${{ matrix.shard }}-
            ocr-cache-
      - name: Parse filings (shard ${{ matrix.shard }})
        env:
          # the 2026-07-24 run OOM'd on every shard at the default heap cap;
          # public runners have 16 GB — give node real headroom
          NODE_OPTIONS: --max-old-space-size=12288
          OCR_CACHE_DIR: ocr-cache
        run: |
          # TOOLCHAIN PROBE. Run #604 — the v203 full re-parse — ran this line
          # with no `apt-get update`, both streams sent to /dev/null and
          # `|| true`, the install resolved nothing, and all twenty shards
          # downloaded all 69,046 filings and could extract text from none.
          # 60,033 confident lineups were destroyed, every shard exited 0, and
          # the only thing that caught it was the publish gate's REPARSE
          # VERDICT — the diagnosis did not exist, because the parse step's own
          # account of itself had been thrown away on purpose.
          #
          # `apt-get install` is atomic: if EITHER package is unresolvable,
          # neither lands. Prep asks for one package and parse asks for two, so
          # prep's gate passed over ten live specimens at 04:50 while parse was
          # already toolless at 05:17 — the two steps disagreeing is what made
          # it look like a parser defect for forty-three minutes.
          #
          # So: update first, keep the output, and NO `|| true`. A job that
          # cannot read a PDF must die in four seconds, not write 69,046 status
          # rows saying it tried. docs/accuracy-log.md 2026-10-09.
          sudo apt-get update -qq
          sudo apt-get install -y -q poppler-utils tesseract-ocr
          pdftotext -v
          pdftoppm -v
          tesseract -v
          # PUT THE FAILURE WHERE IT CAN BE READ. Runs #249 and #252 both died
          # with their parse shards exiting non-zero, and the reason was
          # unreachable: a shard log is ~430,000 lines and the tooling that
          # reads it returns only the tail, which is artifact-upload chatter.
          # Five hypotheses were raised and refuted against that blindness
          # (time budget, disk, S3 load, missing shard, OOM — the last two
          # measured directly: RSS flat at ~645 MB across 55 filings, WORK dir
          # steady at 17 MB). The blocker was never the bug; it was that the
          # program's own account of itself sat where nothing could see it.
          # So: stream as before, and on failure re-print the tail AT THE END,
          # which is exactly where a tail-only reader lands.
          set -o pipefail
          # AND THE TAIL MUST BE DUMPED ON **ANY** ENDING, NOT ONLY A NON-ZERO
          # EXIT. Run #605's shard 1 hung for 3h14m and was cancelled by hand;
          # because the dump below was gated on `ec -ne 0`, a CANCELLED step
          # never reaches it, so the one failure mode where the log is the only
          # evidence produced none at all. It also wrote no results-1.json —
          # that flushes every 250 filings, so the hang was inside its first
          # 250 — leaving the shard with neither a log nor an artifact.
          #
          # Same shape as #604 one run earlier: the program's account of itself
          # was computed and then discarded unless one specific branch ran.
          # A trap fires on the signal GitHub sends to cancel, so the tail now
          # lands for success, failure, timeout and cancellation alike.
          dump() {
            echo "===== SHARD ${{ matrix.shard }} — last 40 lines (ending: $1) ====="
            tail -40 /tmp/parse-${{ matrix.shard }}.log 2>/dev/null || echo "(no log was written)"
            echo "===== end shard ${{ matrix.shard }} tail ====="
          }
          trap 'dump SIGNALLED; exit 143' TERM INT
          TIME_BUDGET_MIN=320 PARSE_SHARD=${{ matrix.shard }} PARSE_SHARDS=${{ needs.prep.outputs.count }} BATCH_4I=999999 \
            node scripts/fetch-4i.mjs 2>&1 | tee /tmp/parse-${{ matrix.shard }}.log
          ec=$?
          if [ "$ec" -ne 0 ]; then
            echo "::error::parse shard ${{ matrix.shard }} exited $ec"
            dump "exit $ec"
          fi
          exit $ec
      - uses: actions/upload-artifact@v4
        # always upload: fetch-4i flushes results-N.json every 250 filings, so
        # even a crashed shard hands its progress to the merge job
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: results-${{ matrix.shard }}.json
          if-no-files-found: warn

  merge:
    needs: [prep, parse]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: data-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
      - name: Merge shard results and commit
        # Single-line JSON stores can never rebase across a concurrent push
        # (this killed a full v9 run): so instead of transplanting a stale
        # commit, re-apply the deltas onto the LATEST branch state and retry.
        # plans-all/mtias come from the prep artifact and survive the reset;
        # results-*.json are untracked. merge-4i is idempotent per attempt.
        run: |
          git config user.name "wampo-data-bot"
          git config user.email "noreply@anthropic.com"
          cp plans-all.json plans-list.json mtias.json /tmp/
          cp fee-percentiles.json /tmp/ 2>/dev/null || true
          rm -rf /tmp/plansdetail && cp -r data/plans /tmp/plansdetail 2>/dev/null || true
          rm -rf /tmp/fees && cp -r data/fees /tmp/fees 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/plans-all.json /tmp/plans-list.json /tmp/mtias.json .
            cp /tmp/fee-percentiles.json . 2>/dev/null || true
            if [ -d /tmp/plansdetail ]; then rm -rf data/plans && cp -r /tmp/plansdetail data/plans; fi
            if [ -d /tmp/fees ]; then rm -rf data/fees && cp -r /tmp/fees data/fees; fi
            node scripts/merge-4i.mjs
            node scripts/audit-data.mjs || true
            # PUBLISH GATE (owner directive): a run whose REPARSE VERDICT
            # regressed beyond tolerance must NOT publish its data — the
            # run fails here, the diff and losses-triage stay in this log
            # for review, and the previous (better) data keeps serving.
            # After review, either fix the parser or, for a justified
            # intentional regression, re-run with ALLOW_REGRESSION=1.
            if [ "${ALLOW_REGRESSION:-0}" != "1" ] && grep -q "reparse-regression" audit-high.txt 2>/dev/null; then
              echo "::error::REPARSE VERDICT regressed beyond tolerance — data NOT committed. Review the confidence diff and losses-triage above, then fix or justify (accuracy protocol)."
              exit 1
            fi
            node scripts/build-seo-pages.mjs || true
            # map-points.json is row-aligned to plans-all, so it MUST be
            # rebuilt in the same job that rewrites plans-all. Shipped once
            # by hand and left out of the pipeline, it silently put 23% of
            # the map's dots on the wrong plan the moment the universe grew.
            # No "|| true" here: a map built against the wrong universe is a
            # wrong answer, and a failed build should fail the run.
            node scripts/build-map-points.mjs
            git add plans-all.json plans-list.json plans-index.json mtias.json fee-percentiles.json lineups-status.json lineups-index.json data/lineups data/fees data/plans docs/coverage-history.jsonl p sitemap.xml robots.txt map-points.json
            if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
            git commit -m "Update filed plan data (Form 5500 + Schedule H 4i lineups)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push raced with a concurrent commit; retrying (attempt ${attempt})"
            sleep 5
          done
          echo "giving up after 5 attempts" >&2
          exit 1
      - name: Keep the dev branch level with main
        if: always() && github.ref_name == 'main'
        run: |
          # Scheduled runs execute on main and commit data there, while all
          # development lives on the dev branch — so every scheduled commit
          # used to strand main AHEAD until a live session noticed and
          # fast-forwarded by hand. Two days without a session meant two days
          # of that gap (2026-09-05/06). When the dev branch is a strict
          # ancestor of main this sync is a pure fast-forward — nothing can be
          # lost — so the runner does it itself. Any real divergence is left
          # alone for a session and scripts/mirror.sh, which refuse and prove
          # before forcing.
          BR="claude/wampo-401k-live-nx1t4o"
          git fetch origin "$BR" || exit 0
          if git merge-base --is-ancestor "origin/$BR" HEAD; then
            git push origin "HEAD:$BR" && echo "dev branch fast-forwarded to $(git rev-parse --short HEAD)"
          else
            echo "dev branch has diverged from main — leaving it for a session to reconcile"
          fi
      - name: Surface audit HIGH findings (auto-managed issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f audit-high.txt ] || exit 0
          TITLE="Data audit: HIGH findings (auto)"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -s audit-high.txt ]; then
            BODY=$(printf 'The latest pipeline run flagged these HIGH findings — investigate per the accuracy protocol (docs/accuracy-log.md) and log the outcome there. This issue is auto-updated by every run and closes itself when the findings clear.\n\n```\n%s```\n\nRun: %s' "$(cat audit-high.txt)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body "$BODY" >/dev/null; else gh issue create --title "$TITLE" --body "$BODY" >/dev/null; fi
            echo "HIGH findings surfaced on issue ${NUM:-new}"
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Latest run reports no HIGH findings — closing." >/dev/null
            echo "cleared and closed issue $NUM"
          fi
