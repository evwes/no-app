name: Build plan data from Form 5500

on:
  workflow_dispatch:
  schedule:
    # weekly refresh: new EFAST2 filings, plan-year rollovers, new lineups
    # (scheduled runs execute on the default branch only)
    - cron: "0 6 * * 1"
  push:
    # main is a force-mirror of the dev branch, so a main push trigger would
    # run the identical parse twice — dev-branch runs are the only push runs
    branches: ["claude/wampo-401k-live-nx1t4o"]
    paths: ["scripts/build-data.mjs", "scripts/fetch-4i.mjs", "scripts/lib-4i.mjs", "scripts/merge-4i.mjs", "scripts/.kick", ".github/workflows/build-data.yml"]

# a newer push supersedes an in-flight parse of the same ref: the work list is
# recomputed from parser versions anyway, so cancel instead of double-parsing
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # issues: write powers the auto-managed "Data audit: HIGH findings" issue
  issues: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parser gate (ten live specimens — fails fast before the matrix)
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
          node scripts/parser-gate.mjs
      - name: Download and process DOL Form 5500 datasets
        run: node scripts/build-data.mjs
      - name: Plan parse shards
        id: plan
        run: |
          OUT=$(BATCH_4I=0 node scripts/fetch-4i.mjs)
          WORK=$(echo "$OUT" | grep -oP 'work list: \K\d+' || echo 0)
          OCR=$(echo "$OUT" | grep -oP 'ocr candidates: \K\d+' || echo 0)
          # OCR items cost ~20-45s vs ~0.6s for text parses — shard for both
          N1=$(( (WORK + 5499) / 5500 )); N2=$(( (OCR + 599) / 600 ))
          N=$N1; [ "$N2" -gt "$N" ] && N=$N2
          [ "$N" -lt 1 ] && N=1; [ "$N" -gt 20 ] && N=20
          echo "work=$WORK ocr=$OCR shards=$N"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -e "console.log(JSON.stringify([...Array($N).keys()]))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: data-inputs
          path: |
            plans-all.json
            plans-list.json
            mtias.json
            fee-percentiles.json
            fallbacks.json
            lineups-status.json
            lineups-index.json
            data/lineups/
            data/fees/
            data/plans/
          include-hidden-files: false

  parse:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: data-inputs
      # OCR text cache: parser-version bumps re-parse everything but should
      # NOT re-rasterize ~12k scanned filings (~4h). Keyed per shard with a
      # unique suffix so every run SAVES its updated cache; restore-keys pick
      # the newest previous one. OCR_VERSION lives in the cached filenames,
      # so bumping it simply misses and repopulates.
      - uses: actions/cache@v4
        with:
          path: ocr-cache
          key: ocr-cache-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ocr-cache-shard${{ matrix.shard }}-
            ocr-cache-
      - name: Parse filings (shard ${{ matrix.shard }})
        env:
          # the 2026-07-24 run OOM'd on every shard at the default heap cap;
          # public runners have 16 GB — give node real headroom
          NODE_OPTIONS: --max-old-space-size=12288
          OCR_CACHE_DIR: ocr-cache
        run: |
          sudo apt-get install -y -q poppler-utils tesseract-ocr >/dev/null 2>&1 || true
          TIME_BUDGET_MIN=320 PARSE_SHARD=${{ matrix.shard }} PARSE_SHARDS=${{ needs.prep.outputs.count }} BATCH_4I=999999 node scripts/fetch-4i.mjs
      - uses: actions/upload-artifact@v4
        # always upload: fetch-4i flushes results-N.json every 250 filings, so
        # even a crashed shard hands its progress to the merge job
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: results-${{ matrix.shard }}.json
          if-no-files-found: warn

  merge:
    needs: [prep, parse]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: data-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
      - name: Merge shard results and commit
        # Single-line JSON stores can never rebase across a concurrent push
        # (this killed a full v9 run): so instead of transplanting a stale
        # commit, re-apply the deltas onto the LATEST branch state and retry.
        # plans-all/mtias come from the prep artifact and survive the reset;
        # results-*.json are untracked. merge-4i is idempotent per attempt.
        run: |
          git config user.name "wampo-data-bot"
          git config user.email "noreply@anthropic.com"
          cp plans-all.json plans-list.json mtias.json /tmp/
          cp fee-percentiles.json /tmp/ 2>/dev/null || true
          rm -rf /tmp/plansdetail && cp -r data/plans /tmp/plansdetail 2>/dev/null || true
          rm -rf /tmp/fees && cp -r data/fees /tmp/fees 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/plans-all.json /tmp/plans-list.json /tmp/mtias.json .
            cp /tmp/fee-percentiles.json . 2>/dev/null || true
            if [ -d /tmp/plansdetail ]; then rm -rf data/plans && cp -r /tmp/plansdetail data/plans; fi
            if [ -d /tmp/fees ]; then rm -rf data/fees && cp -r /tmp/fees data/fees; fi
            node scripts/merge-4i.mjs
            node scripts/audit-data.mjs || true
            # PUBLISH GATE (owner directive): a run whose REPARSE VERDICT
            # regressed beyond tolerance must NOT publish its data — the
            # run fails here, the diff and losses-triage stay in this log
            # for review, and the previous (better) data keeps serving.
            # After review, either fix the parser or, for a justified
            # intentional regression, re-run with ALLOW_REGRESSION=1.
            if [ "${ALLOW_REGRESSION:-0}" != "1" ] && grep -q "reparse-regression" audit-high.txt 2>/dev/null; then
              echo "::error::REPARSE VERDICT regressed beyond tolerance — data NOT committed. Review the confidence diff and losses-triage above, then fix or justify (accuracy protocol)."
              exit 1
            fi
            node scripts/build-seo-pages.mjs || true
            # map-points.json is row-aligned to plans-all, so it MUST be
            # rebuilt in the same job that rewrites plans-all. Shipped once
            # by hand and left out of the pipeline, it silently put 23% of
            # the map's dots on the wrong plan the moment the universe grew.
            # No "|| true" here: a map built against the wrong universe is a
            # wrong answer, and a failed build should fail the run.
            node scripts/build-map-points.mjs
            git add plans-all.json plans-list.json plans-index.json mtias.json fee-percentiles.json lineups-status.json lineups-index.json data/lineups data/fees data/plans docs/coverage-history.jsonl p sitemap.xml robots.txt map-points.json
            if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
            git commit -m "Update filed plan data (Form 5500 + Schedule H 4i lineups)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push raced with a concurrent commit; retrying (attempt ${attempt})"
            sleep 5
          done
          echo "giving up after 5 attempts" >&2
          exit 1
      - name: Surface audit HIGH findings (auto-managed issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f audit-high.txt ] || exit 0
          TITLE="Data audit: HIGH findings (auto)"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -s audit-high.txt ]; then
            BODY=$(printf 'The latest pipeline run flagged these HIGH findings — investigate per the accuracy protocol (docs/accuracy-log.md) and log the outcome there. This issue is auto-updated by every run and closes itself when the findings clear.\n\n```\n%s```\n\nRun: %s' "$(cat audit-high.txt)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body "$BODY" >/dev/null; else gh issue create --title "$TITLE" --body "$BODY" >/dev/null; fi
            echo "HIGH findings surfaced on issue ${NUM:-new}"
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Latest run reports no HIGH findings — closing." >/dev/null
            echo "cleared and closed issue $NUM"
          fi
